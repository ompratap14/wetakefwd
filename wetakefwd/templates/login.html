<!DOCTYPE html>
<html>
<head>
<title>We Take Forward (WTF) Login</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
background:#11131b;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

form{
background:#111827;
padding:30px;
border-radius:10px;
width:300px;
}

input{
box-sizing:border-box;
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:#2647ff;
color:white;
border:none;
}
</style>
</head>
<body>

<form method="POST">

<h2>We Take Forward (WTF) Admin</h2>

{% if unavailable %}
<p role="status">Admin sign-in is temporarily unavailable. The site owner needs to complete the server configuration.</p>
<a href="/" style="color:#aebaff">Back to website</a>
{% else %}
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<label for="username">Username</label>
<input type="text"
id="username" autocomplete="username"
name="username"
placeholder="Username"
required>

<label for="password">Password</label>
<input type="password" id="password" autocomplete="current-password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>
{% endif %}

</form>

</body>
</html>
