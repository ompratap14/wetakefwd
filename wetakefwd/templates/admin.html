<!DOCTYPE html>
<html>
<head>
    <title>WeTakeFWD Lead Dashboard</title>
    <meta name="robots" content="noindex,nofollow">

    <style>
        body{
            background:#11131b;
            color:white;
            font-family:Arial,sans-serif;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#0f172a;
        }

        th,td{
            border:1px solid #333;
            padding:12px;
            text-align:left;
        }

        th{
            background:#2647ff;
        }

        tr:nth-child(even){
            background:#111827;
        }

        tr:hover{
            background:#1e293b;
        }
    </style>
</head>
<body>

<h1>WeTakeFWD Lead Dashboard</h1>
<p><a href="/logout" style="color:#aebaff">Log out</a></p>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Company</th>
    <th>Service</th>
    <th>Message</th>
    <th>Action</th>
</tr>
{% for lead in leads %}
<tr>
    <td>{{ lead[0] }}</td>
    <td>{{ lead[1] }}</td>
    <td>{{ lead[2] }}</td>
    <td>{{ lead[3] }}</td>
    <td>{{ lead[4] }}</td>
    <td>{{ lead[5] }}</td>

    <td>
        <form action="/delete/{{ lead[0] }}"
      method="POST"
      style="display:inline;"
      onsubmit="return confirm('Delete this lead?');">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <button type="submit"
        style="
            background:#dc2626;
            color:white;
            padding:6px 12px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:14px;">
        Delete
    </button>

</form>
        
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
